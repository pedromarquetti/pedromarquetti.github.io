name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, refactor/astro]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run check:content
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
