name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, refactor/astro]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm format
        run: npm run format

      - name: npm check
        run: npm run check

      - name: npm content check
        run: npm run check:content

      - name: npm build
        run: npm run build

      - name: npm link check
        run: npm run check:links

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
